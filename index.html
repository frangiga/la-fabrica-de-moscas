<!-- Contenedor general (casilla izquierda y casilla derecha) -->
<div class="header-bar">
  <!-- Casilla Izquierda -->
  <div class="box left">
    <span class="brand-name">GeoPaterna</span>
  </div>

  <!-- Casilla Derecha -->
  <div class="box right">
    <span class="user-name">fran_giga</span>

    <!-- Selector de Idioma -->
    <div class="lang-selector">
      <button class="lang-btn" onclick="toggleLangMenu()" aria-label="Seleccionar idioma">
        <span class="flag">🇪🇸</span>
        <span class="lang-text">ES</span>
        <span class="arrow">▼</span>
      </button>

      <ul id="langMenu" class="lang-dropdown">
        <li onclick="selectLanguage('es', '🇪🇸', 'ES')">
          <span class="flag">🇪🇸</span>
          <span class="lang-text">ES</span>
        </li>
        <li onclick="selectLanguage('en', '🇬🇧', 'EN')">
          <span class="flag">🇬🇧</span>
          <span class="lang-text">EN</span>
        </li>
        <li onclick="selectLanguage('de', '🇩🇪', 'DE')">
          <span class="flag">🇩🇪</span>
          <span class="lang-text">DE</span>
        </li>
        <li onclick="selectLanguage('fr', '🇫🇷', 'FR')">
          <span class="flag">🇫🇷</span>
          <span class="lang-text">FR</span>
        </li>
        <li onclick="selectLanguage('nl', '🇳🇱', 'NL')">
          <span class="flag">🇳🇱</span>
          <span class="lang-text">NL</span>
        </li>
        <li onclick="selectLanguage('pt', '🇵🇹', 'PT')">
          <span class="flag">🇵🇹</span>
          <span class="lang-text">PT</span>
        </li>
      </ul>
    </div>
  </div>
</div>

<style>
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    padding: 10px 15px;
    background-color: #f8f9fa;
    border-bottom: 1px solid #e0e0e0;
  }

  .box {
    display: flex;
    align-items: center;
    white-space: nowrap; /* Control estricto para evitar saltos de línea */
  }

  .left {
    justify-content: flex-start;
  }

  .right {
    justify-content: flex-end;
    gap: 15px;
  }

  .brand-name, .user-name {
    font-weight: bold;
    font-size: 1rem;
  }

  .lang-selector {
    position: relative;
    display: inline-block;
  }

  .lang-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .lang-btn:hover {
    background-color: #f0f0f0;
  }

  .arrow {
    font-size: 0.7rem;
    margin-left: 2px;
  }

  .lang-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 4px;
    background-color: #ffffff;
    border: 1px solid #ccc;
    border-radius: 4px;
    list-style: none;
    padding: 0;
    min-width: 90px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 100;
  }

  .lang-dropdown.show {
    display: block;
  }

  .lang-dropdown li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  .lang-dropdown li:hover {
    background-color: #f0f0f0;
  }
</style>

<script>
  function toggleLangMenu() {
    document.getElementById('langMenu').classList.toggle('show');
  }

  function selectLanguage(code, flag, text) {
    const btn = document.querySelector('.lang-btn');
    btn.querySelector('.flag').textContent = flag;
    btn.querySelector('.lang-text').textContent = text;
    document.getElementById('langMenu').classList.remove('show');
  }

  window.onclick = function(event) {
    if (!event.target.closest('.lang-selector')) {
      const dropdown = document.getElementById('langMenu');
      if (dropdown && dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
      }
    }
  }
</script>
